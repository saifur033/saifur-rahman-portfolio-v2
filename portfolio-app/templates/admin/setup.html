{% extends 'admin/base.html' %}{% block title %}First account setup{% endblock %}{% block content %}<section class="auth-card"><p class="eyebrow">ONE-TIME SETUP</p><h1>Create your private admin account</h1><p>The first account is created only by you. No default credentials are included.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required autocomplete="email"></label><label>Password (at least 12 characters)<input type="password" name="password" required minlength="12" autocomplete="new-password"></label><label>Confirm password<input type="password" name="confirm" required minlength="12" autocomplete="new-password"></label><button class="btn primary" type="submit">Create account</button></form></section>{% endblock %}
