<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Studio{% endblock %} · Private Studio</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"><script defer src="{{ url_for('static',filename='js/main.js') }}"></script></head><body class="admin-body"><header class="topbar admin-topbar"><a class="brand" href="{{ url_for('admin.dashboard') }}">SR<span>.</span> Studio</a><a href="{{ url_for('public.home') }}" target="_blank" rel="noopener">View public site ↗</a>{% if session.get('admin_id') %}<form method="post" action="{{ url_for('admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="btn">Sign out</button></form>{% endif %}</header>{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-wrap">{% for category,message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}</div>{% endif %}{% endwith %}<main class="admin-main">{% block content %}{% endblock %}</main></body></html>
